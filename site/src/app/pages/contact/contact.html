<header class="page-head">
  <h1 class="page-title reveal" style="--i: 0">Contact</h1>
  <p class="lede reveal" style="--i: 1">{{ page.lede }}</p>
</header>

<section aria-labelledby="contact-details">
  <h2 id="contact-details" class="visually-hidden">Contact details</h2>
  <dl class="facts">
    <div>
      <dt>{{ site.links.email.label }}</dt>
      <dd>
        <a class="with-icon" [href]="site.links.email.url"
          ><app-contact-icon [label]="site.links.email.label" /><span>{{ site.links.email.display }}</span></a
        >
      </dd>
    </div>
    @for (link of site.links.social; track link.url) {
      <div>
        <dt>{{ link.label }}</dt>
        <dd>
          <a class="with-icon" [href]="link.url"
            ><app-contact-icon [label]="link.label" /><span>{{ link.display }}</span></a
          >
        </dd>
      </div>
    }
    <div>
      <dt>Location</dt>
      <dd>{{ site.person.location }}</dd>
    </div>
    <div>
      <dt>Languages</dt>
      <dd>{{ languages }}</dd>
    </div>
  </dl>
</section>
