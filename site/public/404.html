<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Manuel Fas</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f2a32">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Static page that GitHub Pages serves for unknown URLs. It mirrors the site's header and styles,
       including the reader's saved colour theme (set by the site's header toggle). -->
  <script>
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
  <style>
    @font-face { font-family: 'Newsreader'; src: url('/fonts/newsreader-latin-var.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
    @font-face { font-family: 'Atkinson Hyperlegible Next'; src: url('/fonts/atkinson-hyperlegible-next-latin-var.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
    :root { color-scheme: light; --ink: #0f2a32; --text: #14262c; --paper: #f5f2ea; --link: #0b5560; --accent: #9c370b; --amber: #f0a23b; --on-ink: #f5f2ea; --on-ink-muted: #a9bfc1; --bar: #0f2a32; --bar-edge: transparent; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme='light']) { color-scheme: dark; --ink: #f5f2ea; --text: #e6e1d6; --paper: #0a1b21; --link: #7cc7cf; --accent: #f08c5f; --bar-edge: #24414a; }
    }
    html:is([data-theme='dark']) { color-scheme: dark; --ink: #f5f2ea; --text: #e6e1d6; --paper: #0a1b21; --link: #7cc7cf; --accent: #f08c5f; --bar-edge: #24414a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--text); font: 1.0625rem/1.65 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif; }
    a { color: var(--link); text-underline-offset: 0.18em; }
    a:hover { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .wrap { width: min(100% - 2.5rem, 46rem); margin-inline: auto; }
    .frame { width: min(100% - 2.5rem, 46rem); margin-inline: auto; }
    @media (min-width: 64rem) { .frame { width: min(100% - 2.5rem, 70rem); } }
    .skip { position: absolute; top: 0.75rem; left: 1rem; padding: 0.6rem 0.9rem; background: var(--amber); color: var(--bar); font-weight: 700; text-decoration: none; transform: translateY(-250%); }
    .skip:focus { transform: none; outline-color: var(--bar); }
    header { border-bottom: 1px solid var(--bar-edge); background: var(--bar); }
    header :focus-visible { outline-color: var(--amber); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem 2rem; padding-block: 0.65rem; }
    .wordmark { padding-block: 0.25rem; color: var(--on-ink); font: 600 1.3rem 'Newsreader', Georgia, serif; text-decoration: none; }
    nav ul { display: flex; flex-wrap: wrap; gap: 0 1.15rem; margin: 0; padding: 0; list-style: none; }
    nav a { display: inline-block; padding-block: 0.4rem 0.25rem; color: var(--on-ink-muted); font-size: 0.95rem; font-weight: 600; text-decoration: none; }
    nav a:hover, .wordmark:hover { color: var(--amber); }
    main { padding-block: clamp(2.5rem, 7vw, 4.5rem); }
    main:focus { outline: none; }
    h1 { margin: 0; color: var(--ink); font: 560 clamp(2.25rem, 1.7rem + 2.4vw, 3.25rem)/1.05 'Newsreader', Georgia, serif; letter-spacing: -0.02em; }
    p { margin: 1.1rem 0 0; }
    .home { font-weight: 600; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header>
    <div class="frame bar">
      <a class="wordmark" href="/">Manuel Fas</a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="/experience/">Experience</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/certifications/">Certifications</a></li>
          <li><a href="/education/">Education</a></li>
          <li><a href="/contact/">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <h1>Page not found</h1>
    <p>There is no page at this address.</p>
    <p><a class="home" href="/">Go to the home page</a></p>
  </main>
</body>
</html>
